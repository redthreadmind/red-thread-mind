name: keepalive

on:
  schedule:
    - cron: "0 3 1 * *"   # 1st of every month, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a heartbeat
        run: |
          date -u +"%Y-%m-%d" > .github/keepalive.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "keepalive $(date -u +%Y-%m-%d)" || echo "No changes"
          git push